<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raghuvir Sweets And Bakers | Stock Scan</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
  :root{
    --brand-crimson:#a5192a;
    --brand-crimson-dark:#7d1220;
    --brand-orange:#f5871f;
    --brand-orange-light:#fff3e6;
    --bg-soft:#faf7f5;
    --ink:#2b2320;
  }
  * { box-sizing: border-box; }
  body{
    background:var(--bg-soft);
    color:var(--ink);
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    padding-bottom:90px;
    touch-action: manipulation;
  }

  .app-header{
    background:linear-gradient(90deg, var(--brand-crimson) 0%, var(--brand-crimson-dark) 100%);
    color:#fff;
    padding:.6rem 1rem;
    display:flex;
    align-items:center;
    gap:.6rem;
  }
  .app-header .brand-logo{
    height:38px; width:38px; object-fit:contain; border-radius:8px; background:#fff; padding:2px;
  }
  .app-header .brand-name{ font-weight:700; font-size:1rem; line-height:1.1; }
  .branch-pill{
    margin-left:auto;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);
    font-size:.75rem; font-weight:700;
    padding:.25rem .65rem; border-radius:999px;
  }

  .config-banner{
    background:#fff3cd; border-bottom:1px solid #ffe69c; color:#664d03;
    padding:.5rem 1rem; font-size:.8rem; text-align:center; display:none;
  }

  .branch-picker-overlay{
    position:fixed; inset:0; z-index:2000;
    background:rgba(43,35,32,.55);
    display:flex; align-items:center; justify-content:center;
    padding:1rem;
  }
  .branch-picker-card{
    background:#fff; border-radius:16px; padding:1.4rem 1.2rem;
    max-width:360px; width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .branch-picker-card h5{
    color:var(--brand-crimson-dark); font-weight:800; margin-bottom:.9rem; text-align:center;
  }
  .branch-choice-btn{
    display:block; width:100%; text-align:left;
    background:var(--brand-orange-light);
    border:1px solid #f0d3b8;
    color:var(--brand-crimson-dark);
    font-weight:700;
    padding:.65rem .9rem;
    border-radius:10px;
    margin-bottom:.55rem;
  }
  .branch-choice-btn:hover{ background:#ffe6c2; }

  .camera-wrap{
    max-width:340px;
    margin:0.75rem auto 0;
    padding:0 .75rem;
  }
  .camera-box{
    background:#000;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 16px rgba(165,25,42,.15);
  }
  #qrReader{ width:100%; }
  #qrReader video{ border-radius:14px; display:block; }
  .scan-banner{
    position:absolute; left:0; right:0; bottom:0;
    background:rgba(0,0,0,.75);
    color:#fff;
    padding:.65rem .9rem;
    font-size:.9rem;
    font-weight:600;
    text-align:center;
    min-height:2.6rem;
  }
  .scan-banner.ok{ background:rgba(31,160,74,.9); }
  .scan-banner.err{ background:rgba(220,53,69,.9); }

  .list-wrap{
    max-width:900px;
    margin:.9rem auto 0;
    padding:0 .75rem;
  }
  .list-card{
    background:#fff;
    border-radius:14px;
    border:1px solid #eee0d8;
    box-shadow:0 2px 10px rgba(165,25,42,.06);
  }
  .list-header{
    padding:.7rem .9rem;
    border-bottom:1px solid #f1e5dc;
    font-weight:700;
    font-size:.9rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .count-badge{
    background:var(--brand-orange-light);
    color:var(--brand-crimson-dark);
    border:1px solid #f0d3b8;
    font-weight:800;
    font-size:.78rem;
    padding:.2rem .6rem;
    border-radius:999px;
  }
  .scan-table{ margin-bottom:0; width:100%; }
  .scan-table thead th{
    background:#f6ede6;
    color:var(--brand-crimson-dark);
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.4px;
    border:none;
    padding:.65rem .9rem;
  }
  .scan-table tbody td{
    font-size:.95rem;
    vertical-align:middle;
    padding:.65rem .9rem;
  }
  .qty-adjust{ 
    display:inline-flex; 
    align-items:center; 
    gap:.35rem; 
    user-select: none;
    -webkit-user-select: none;
  }
  .qty-adjust button{
    width:36px; height:36px; line-height:1;
    border:1px solid var(--brand-orange);
    background:var(--brand-orange-light);
    color:var(--brand-crimson-dark);
    border-radius:6px; font-size:1rem;
    display:inline-flex; align-items:center; justify-content:center;
    user-select:none;
    -webkit-user-select:none;
    touch-action: manipulation;
    outline: none;
  }
  .qty-adjust button:active{
    background:var(--brand-orange);
    color:#fff;
  }
  .remove-btn{ 
    border:none; 
    background:none; 
    color:#dc3545; 
    font-size:1.1rem; 
    padding:.4rem .6rem; 
    user-select:none;
    -webkit-user-select:none;
    touch-action: manipulation;
    outline: none;
  }
  .empty-list{ text-align:center; color:#a99184; padding:1.6rem; font-size:.85rem; }

  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:#fff;
    border-top:1px solid #eee0d8;
    box-shadow:0 -2px 12px rgba(0,0,0,.08);
    padding:.6rem .9rem;
    z-index:1030;
  }
  .bottom-bar-inner{
    max-width:900px;
    margin:0 auto;
  }
  .btn-final-submit{
    background:linear-gradient(90deg, var(--brand-crimson), var(--brand-crimson-dark));
    border:none;
    color:#fff;
    font-weight:700;
    font-size:.85rem;
    padding:.55rem 1rem;
    border-radius:8px;
    white-space:nowrap;
  }
  .btn-final-submit:disabled{ opacity:.5; }
</style>
</head>
<body>

<div class="config-banner" id="configBanner">
  <i class="fa-solid fa-triangle-exclamation"></i>
  APPS_SCRIPT_URL is not configured properly.
</div>

<div class="branch-picker-overlay" id="branchPickerOverlay" style="display:none;">
  <div class="branch-picker-card">
    <h5><i class="fa-solid fa-store"></i> Select Your Branch</h5>
    <div id="branchChoiceList"></div>
  </div>
</div>

<input type="text" id="btScannerInput" autocomplete="off" inputmode="none" readonly style="position:fixed; top:-1000px; left:-1000px; opacity:0;">

<div class="app-header">
  <img class="brand-logo" src="https://lh3.googleusercontent.com/d/18aiuiSN9uj-mJtOkGB1rNt4GP6yUbvuO" alt="Logo" onerror="this.style.display='none'">
  <span class="brand-name">Raghuvir Stock Scan</span>
  <span class="branch-pill" id="branchPill"><i class="fa-solid fa-store"></i> --</span>
</div>

<div class="camera-wrap">
  <div class="camera-box">
    <div id="qrReader"></div>
    <div class="scan-banner" id="scanBanner">Starting camera...</div>
  </div>
</div>

<div class="list-wrap">
  <div class="list-card">
    <div class="list-header">
      <span><i class="fa-solid fa-list-ol"></i> Scanned Items</span>
      <span class="count-badge" id="countBadge">0 items</span>
    </div>
    <div class="table-responsive">
      <table class="table scan-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Unit</th>
            <th>Qty</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="scanTableBody">
          <tr><td colspan="4" class="empty-list">Point the camera at a barcode to start scanning...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <button class="btn-final-submit w-100" id="finalSubmitBtn" type="button" disabled tabindex="-1">
      <i class="fa-solid fa-check-double"></i> Submit Scanned Items
    </button>
  </div>
</div>

<audio id="beepSuccess" preload="auto">
  <source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg" type="audio/ogg">
</audio>
<audio id="beepError" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyo-vJOoWzfd7PPKIaOCdqDn3W3GUYXQsFjESVl3Iqnh4uuOXF6j903cTwj2nmdlpkP_g/exec';

const BRANCH_OPTIONS = [
  { id: 'RAMMANDIR',   label: 'Ram Mandir' },
  { id: 'VISHRAMBAGH', label: 'Vishrambagh' }
];

const urlParams = new URLSearchParams(window.location.search);
let BRANCH_ID = (urlParams.get('branch') || '').toUpperCase();
let BRANCH_LABEL = '';

let scannedItems = [];
let html5QrCode = null;
let cameraStarted = false;
let lastCode = '';
let lastCodeTime = 0;
const SCAN_COOLDOWN_MS = 600;
let scanQueue = [];
let queueRunning = false;

document.addEventListener('DOMContentLoaded', function () {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    document.getElementById('configBanner').style.display = 'block';
  }

  const knownIds = BRANCH_OPTIONS.map(function (b) { return b.id; });

  if (BRANCH_ID && knownIds.indexOf(BRANCH_ID) !== -1) {
    beginForBranch(BRANCH_ID);
  } else {
    showBranchPicker();
  }
});

function showBranchPicker() {
  const overlay = document.getElementById('branchPickerOverlay');
  const list = document.getElementById('branchChoiceList');
  list.innerHTML = BRANCH_OPTIONS.map(function (b) {
    return '<button type="button" tabindex="-1" class="branch-choice-btn" onclick="chooseBranch(\'' + b.id + '\')">' +
             '<i class="fa-solid fa-store"></i> ' + escapeHtml(b.label) +
           '</button>';
  }).join('');
  overlay.style.display = 'flex';
}

function chooseBranch(id) {
  const url = new URL(window.location.href);
  url.searchParams.set('branch', id);
  window.history.replaceState({}, '', url);

  document.getElementById('branchPickerOverlay').style.display = 'none';
  beginForBranch(id);
}

function beginForBranch(id) {
  BRANCH_ID = id;
  const match = BRANCH_OPTIONS.find(function (b) { return b.id === id; });
  BRANCH_LABEL = match ? match.label : id;

  document.getElementById('branchPill').innerHTML = '<i class="fa-solid fa-store"></i> ' + escapeHtml(BRANCH_LABEL);
  document.getElementById('finalSubmitBtn').addEventListener('click', finalSubmit);

  wireBluetoothScanner();
  if (!cameraStarted) {
    cameraStarted = true;
    startCamera();
  }
}

function startCamera() {
  html5QrCode = new Html5Qrcode('qrReader');

  const config = {
    fps: 20,
    qrbox: { width: 250, height: 140 },
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  };

  html5QrCode.start(
    { facingMode: 'environment' },
    config,
    processScan,
    function onFail() {}
  ).then(function () {
    setBanner('Point camera at a barcode...', '');
  }).catch(function (err) {
    setBanner('Camera error: ' + err, 'err');
  });
}

function processScan(decodedText) {
  if (!BRANCH_ID) return;

  const rawCode = String(decodedText || '').trim();
  if (!rawCode) return;

  const now = Date.now();
  if (rawCode === lastCode && (now - lastCodeTime) < SCAN_COOLDOWN_MS) return;
  lastCode = rawCode;
  lastCodeTime = now;

  scanQueue.push(rawCode);
  setBanner('Queued: ' + rawCode + (scanQueue.length > 1 ? ' (' + scanQueue.length + ' waiting)' : ''), '');
  runQueue();
}

function runQueue() {
  if (queueRunning) return;
  if (scanQueue.length === 0) return;

  queueRunning = true;
  const code = scanQueue.shift();
  setBanner('Looking up ' + code + '...', '');

  apiGet({ action: 'getItemByBarcode', code: code, branch: BRANCH_ID })
    .then(function (result) {
      if (!result.found) {
        playSound('beepError');
        setBanner('❌ Not found: ' + code, 'err');
        return;
      }

      const item = result.item;
      const displayName = item.printName || item.productName;

      const existing = scannedItems.find(function (e) { return e.barcodeCode.toLowerCase() === item.userDefinedCode.toLowerCase(); });
      if (existing) {
        existing.countedQty += 1;
      } else {
        scannedItems.push({
          barcodeCode: item.userDefinedCode,
          itemName: displayName,
          alternateUnit: item.stockUnit,
          countedQty: 1
        });
      }

      playSound('beepSuccess');
      setBanner('✅ ' + displayName + (item.stockUnit ? ' (' + item.stockUnit + ')' : ''), 'ok');
      renderList();
    })
    .catch(function (err) {
      playSound('beepError');
      setBanner('Lookup error — check connection.', 'err');
    })
    .finally(function () {
      queueRunning = false;
      if (scanQueue.length > 0) runQueue();
    });
}

function wireBluetoothScanner() {
  const btInput = document.getElementById('btScannerInput');
  let barcodeBuffer = '';
  let lastKeyTime = Date.now();

  window.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' && e.target !== btInput) return;

    const currentTime = Date.now();
    if (currentTime - lastKeyTime > 100) {
      barcodeBuffer = '';
    }
    lastKeyTime = currentTime;

    if (e.key === 'Enter') {
      if (barcodeBuffer.length > 0) {
        processScan(barcodeBuffer);
        barcodeBuffer = '';
      }
    } else if (e.key.length === 1) {
      barcodeBuffer += e.key;
    }
  });
}

function setBanner(text, cls) {
  const el = document.getElementById('scanBanner');
  el.textContent = text;
  el.className = 'scan-banner' + (cls ? ' ' + cls : '');
}

function renderList() {
  const body = document.getElementById('scanTableBody');
  const badge = document.getElementById('countBadge');
  const submitBtn = document.getElementById('finalSubmitBtn');

  badge.textContent = scannedItems.length + ' item' + (scannedItems.length === 1 ? '' : 's');
  submitBtn.disabled = scannedItems.length === 0;

  if (scannedItems.length === 0) {
    body.innerHTML = '<tr><td colspan="4" class="empty-list">Point the camera at a barcode to start scanning...</td></tr>';
    return;
  }

  const reversed = scannedItems.slice().reverse();
  const originalIndexOf = function (entry) { return scannedItems.indexOf(entry); };

  body.innerHTML = reversed.map(function (entry) {
    const idx = originalIndexOf(entry);
    return (
      '<tr>' +
        '<td>' + escapeHtml(entry.itemName) + '</td>' +
        '<td class="text-muted">' + escapeHtml(entry.alternateUnit || '-') + '</td>' +
        '<td>' +
          '<span class="qty-adjust">' +
            '<button type="button" tabindex="-1" onpointerdown="event.preventDefault()" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="adjustQty(' + idx + ', -1)"><i class="fa-solid fa-minus"></i></button>' +
            '<span class="fw-semibold mx-2" style="user-select:none;">' + escapeHtml(String(entry.countedQty)) + '</span>' +
            '<button type="button" tabindex="-1" onpointerdown="event.preventDefault()" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="adjustQty(' + idx + ', 1)"><i class="fa-solid fa-plus"></i></button>' +
          '</span>' +
        '</td>' +
        '<td><button type="button" tabindex="-1" class="remove-btn" onpointerdown="event.preventDefault()" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="removeItem(' + idx + ')" title="Remove"><i class="fa-solid fa-trash"></i></button></td>' +
      '</tr>'
    );
  }).join('');
}

function adjustQty(index, delta) {
  const entry = scannedItems[index];
  if (!entry) return;
  entry.countedQty = Math.max(0, entry.countedQty + delta);
  renderList();
}

function removeItem(index) {
  scannedItems.splice(index, 1);
  renderList();
}

function finalSubmit() {
  if (scannedItems.length === 0) return;

  const btn = document.getElementById('finalSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

  const entries = scannedItems.map(function (e) {
    return {
      barcodeCode: e.barcodeCode,
      countedQty: e.countedQty,
      operatorName: '',
      remarks: ''
    };
  });

  apiPost({ action: 'recordStockCountBatch', data: { branchId: BRANCH_ID, entries: entries } })
    .then(function (result) {
      btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Submit';
      if (result.success) {
        playSound('beepSuccess');
        setBanner('✅ Saved ' + result.savedCount + ' items to ' + BRANCH_LABEL, 'ok');
        scannedItems = [];
        renderList();
      } else {
        playSound('beepError');
        setBanner(result.message || 'Submit failed.', 'err');
        btn.disabled = false;
      }
    })
    .catch(function (err) {
      btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Submit';
      playSound('beepError');
      setBanner('Error: ' + err.message, 'err');
      btn.disabled = false;
    });
}

function apiGet(params) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    return Promise.reject(new Error('APPS_SCRIPT_URL is not set.'));
  }
  const query = new URLSearchParams(params).toString();
  return fetch(APPS_SCRIPT_URL + '?' + query, { method: 'GET' })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      try { return JSON.parse(text); }
      catch (e) { throw new Error('Invalid API response — check deployment access is "Anyone".'); }
    });
}

function apiPost(bodyObj) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    return Promise.reject(new Error('APPS_SCRIPT_URL is not set.'));
  }
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(bodyObj)
  })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      try { return JSON.parse(text); }
      catch (e) { throw new Error('Invalid API response — check deployment access is "Anyone".'); }
    });
}

function playSound(id) {
  const audio = document.getElementById(id);
  if (audio) {
    audio.currentTime = 0;
    audio.play().catch(function () {});
  }
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>
</body>
</html>
