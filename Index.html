<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raghuvir Sweets And Bakers | Stock Scan</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
  :root{
    --brand-crimson:#a5192a;
    --brand-crimson-dark:#7d1220;
    --brand-orange:#f5871f;
    --brand-orange-light:#fff3e6;
    --bg-soft:#faf7f5;
    --ink:#2b2320;
  }
  * { box-sizing: border-box; }
  body{
    background:var(--bg-soft);
    color:var(--ink);
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    padding-bottom:90px; /* room for fixed bottom bar */
  }

  /* ---------- HEADER ---------- */
  .app-header{
    background:linear-gradient(90deg, var(--brand-crimson) 0%, var(--brand-crimson-dark) 100%);
    color:#fff;
    padding:.6rem 1rem;
    display:flex;
    align-items:center;
    gap:.6rem;
  }
  .app-header .brand-logo{
    height:38px; width:38px; object-fit:contain; border-radius:8px; background:#fff; padding:2px;
  }
  .app-header .brand-name{ font-weight:700; font-size:1rem; line-height:1.1; }
  .branch-pill{
    margin-left:auto;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);
    font-size:.75rem; font-weight:700;
    padding:.25rem .65rem; border-radius:999px;
  }

  .config-banner{
    background:#fff3cd; border-bottom:1px solid #ffe69c; color:#664d03;
    padding:.5rem 1rem; font-size:.8rem; text-align:center; display:none;
  }

  /* ---------- CAMERA ---------- */
  .camera-wrap{
    max-width:340px;
    margin:0.75rem auto 0;
    padding:0 .75rem;
  }
  .camera-box{
    background:#000;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 16px rgba(165,25,42,.15);
  }
  #qrReader{ width:100%; }
  #qrReader video{ border-radius:14px; display:block; }
  .scan-banner{
    position:absolute; left:0; right:0; bottom:0;
    background:rgba(0,0,0,.75);
    color:#fff;
    padding:.65rem .9rem;
    font-size:.9rem;
    font-weight:600;
    text-align:center;
    min-height:2.6rem;
  }
  .scan-banner.ok{ background:rgba(31,160,74,.9); }
  .scan-banner.err{ background:rgba(220,53,69,.9); }

  /* ---------- SCANNED LIST ---------- */
  .list-wrap{
    max-width:900px;
    margin:.9rem auto 0;
    padding:0 .75rem;
  }
  .list-card{
    background:#fff;
    border-radius:14px;
    border:1px solid #eee0d8;
    box-shadow:0 2px 10px rgba(165,25,42,.06);
  }
  .list-header{
    padding:.7rem .9rem;
    border-bottom:1px solid #f1e5dc;
    font-weight:700;
    font-size:.9rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .count-badge{
    background:var(--brand-orange-light);
    color:var(--brand-crimson-dark);
    border:1px solid #f0d3b8;
    font-weight:800;
    font-size:.78rem;
    padding:.2rem .6rem;
    border-radius:999px;
  }
  .scan-table{ margin-bottom:0; width:100%; }
  .scan-table thead th{
    background:#f6ede6;
    color:var(--brand-crimson-dark);
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.4px;
    border:none;
    padding:.65rem .9rem;
  }
  .scan-table tbody td{
    font-size:.95rem;
    vertical-align:middle;
    padding:.65rem .9rem;
  }
  .qty-adjust{ display:inline-flex; align-items:center; gap:.35rem; }
  .qty-adjust button{
    width:24px; height:24px; line-height:1;
    border:1px solid var(--brand-orange);
    background:var(--brand-orange-light);
    color:var(--brand-crimson-dark);
    border-radius:6px; font-size:.72rem;
  }
  .remove-btn{ border:none; background:none; color:#dc3545; font-size:.95rem; }
  .empty-list{ text-align:center; color:#a99184; padding:1.6rem; font-size:.85rem; }

  /* ---------- BOTTOM BAR (Operator + Final Submit) ---------- */
  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:#fff;
    border-top:1px solid #eee0d8;
    box-shadow:0 -2px 12px rgba(0,0,0,.08);
    padding:.6rem .9rem;
    z-index:1030;
  }
  .bottom-bar-inner{
    max-width:900px;
    margin:0 auto;
  }
  .btn-final-submit{
    background:linear-gradient(90deg, var(--brand-crimson), var(--brand-crimson-dark));
    border:none;
    color:#fff;
    font-weight:700;
    font-size:.85rem;
    padding:.55rem 1rem;
    border-radius:8px;
    white-space:nowrap;
  }
  .btn-final-submit:disabled{ opacity:.5; }

  /* ---------- MANUAL ENTRY TOGGLE ---------- */
  .manual-entry-wrap{
    max-width:340px;
    margin:.6rem auto 0;
    padding:0 .75rem;
  }
  .btn-manual-entry{
    width:100%;
    background:#fff;
    border:1.5px solid var(--brand-crimson);
    color:var(--brand-crimson-dark);
    font-weight:700;
    font-size:.85rem;
    padding:.5rem .8rem;
    border-radius:10px;
  }
  .btn-manual-entry.active{
    background:linear-gradient(90deg, var(--brand-crimson), var(--brand-crimson-dark));
    color:#fff;
    border-color:var(--brand-crimson-dark);
  }

  /* ---------- MANUAL QTY MODAL ---------- */
  .qty-modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(30,15,10,.55);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:1rem;
  }
  .qty-modal-overlay.show{ display:flex; }
  .qty-modal-box{
    background:#fff;
    border-radius:16px;
    width:100%;
    max-width:320px;
    padding:1.25rem 1.1rem 1.1rem;
    box-shadow:0 12px 32px rgba(0,0,0,.25);
  }
  .qty-modal-eyebrow{
    font-size:.7rem;
    font-weight:800;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--brand-orange);
    margin-bottom:.15rem;
  }
  .qty-modal-title{
    font-size:1.05rem;
    font-weight:700;
    color:var(--ink);
    margin-bottom:.9rem;
    line-height:1.3;
  }
  .qty-modal-label{
    font-size:.78rem;
    font-weight:700;
    color:#8a7268;
    margin-bottom:.3rem;
  }
  .qty-modal-input{
    width:100%;
    font-size:1.3rem;
    font-weight:700;
    text-align:center;
    padding:.5rem;
    border:1.5px solid #e9dcd2;
    border-radius:10px;
    margin-bottom:1rem;
  }
  .qty-modal-actions{
    display:flex;
    gap:.6rem;
  }
  .qty-modal-actions button{
    flex:1;
    border-radius:9px;
    font-weight:700;
    font-size:.85rem;
    padding:.55rem .5rem;
    border:none;
  }
  .qty-modal-cancel{
    background:#f3ece7;
    color:#7d6a60;
  }
  .qty-modal-save{
    background:linear-gradient(90deg, var(--brand-crimson), var(--brand-crimson-dark));
    color:#fff;
  }
</style>
</head>
<body>

<div class="config-banner" id="configBanner">
  <i class="fa-solid fa-triangle-exclamation"></i>
  APPS_SCRIPT_URL is not set — open this file and paste your deployed Apps Script /exec URL near the top of the &lt;script&gt; section.
</div>

<!-- Hidden input that stays focused to receive Bluetooth barcode scanner
     input (Bluetooth scanners act like a keyboard: they type the code then
     press Enter automatically). Invisible, but functionally always ready.

     FIX: inputmode="none" + enterkeyhint tell mobile/touch browsers not to
     pop up the on-screen keyboard when this input gets focus, while still
     allowing a real (physical/Bluetooth) keyboard/scanner to type into it.
     autofocus/readonly are intentionally NOT used, since readonly would
     block a physical scanner from typing into it. -->
<input type="text" id="btScannerInput" autocomplete="off" autocorrect="off" autocapitalize="off"
       spellcheck="false" inputmode="none" enterkeyhint="done"
       style="position:fixed; top:-1000px; left:-1000px; opacity:0;">

<!-- ===================== HEADER ===================== -->
<div class="app-header">
  <img class="brand-logo" src="https://lh3.googleusercontent.com/d/18aiuiSN9uj-mJtOkGB1rNt4GP6yUbvuO" alt="Logo" onerror="this.style.display='none'">
  <span class="brand-name">Raghuvir Stock Scan</span>
  <span class="branch-pill" id="branchPill"><i class="fa-solid fa-store"></i> --</span>
  <span class="branch-pill" style="margin-left:.35rem; background:rgba(255,255,255,.1);"><i class="fa-brands fa-bluetooth-b"></i> Ready</span>
</div>

<!-- ===================== MANUAL ENTRY TOGGLE ===================== -->
<div class="manual-entry-wrap">
  <button type="button" class="btn-manual-entry" id="manualEntryBtn">
    <i class="fa-solid fa-pen"></i> Manual Entry
  </button>
</div>

<!-- ===================== CAMERA (always live) ===================== -->
<div class="camera-wrap">
  <div class="camera-box">
    <div id="qrReader"></div>
    <div class="scan-banner" id="scanBanner">Starting camera...</div>
  </div>
</div>

<!-- ===================== SCANNED ITEMS LIST ===================== -->
<div class="list-wrap">
  <div class="list-card">
    <div class="list-header">
      <span><i class="fa-solid fa-list-ol"></i> Scanned Items</span>
      <span class="count-badge" id="countBadge">0 items</span>
    </div>
    <div class="table-responsive">
      <table class="table scan-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Unit</th>
            <th>Qty</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="scanTableBody">
          <tr><td colspan="4" class="empty-list">Point the camera at a barcode to start scanning...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ===================== BOTTOM BAR: Final Submit ===================== -->
<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <button class="btn-final-submit w-100" id="finalSubmitBtn" type="button" disabled>
      <i class="fa-solid fa-check-double"></i> Submit Scanned Items
    </button>
  </div>
</div>

<!-- Audio feedback -->
<audio id="beepSuccess" preload="auto">
  <source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg" type="audio/ogg">
</audio>
<audio id="beepError" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<!-- ===================== MANUAL ENTRY QTY MODAL ===================== -->
<div class="qty-modal-overlay" id="qtyModalOverlay">
  <div class="qty-modal-box">
    <div class="qty-modal-eyebrow">Manual Entry</div>
    <div class="qty-modal-title" id="qtyModalItemName">Item</div>
    <div class="qty-modal-label">Quantity</div>
    <input type="number" inputmode="decimal" class="qty-modal-input" id="qtyModalInput" min="0" step="any">
    <div class="qty-modal-actions">
      <button type="button" class="qty-modal-cancel" id="qtyModalCancelBtn">Cancel</button>
      <button type="button" class="qty-modal-save" id="qtyModalSaveBtn">Save Entry</button>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   ⚠️ REQUIRED CONFIG — paste your deployed Apps Script Web App URL here.
============================================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxBS7ITZkbwM6CWT4V2M_Jgsa5xHXLdON_uhRN5aNec205N-7-37rYmthq3KkbtlSy3uA/exec';

/* ============================================================================
   BRANCH CONTEXT — from the page URL:
     index.html?branch=BR1   -> Branch 1
     index.html?branch=BR2   -> Branch 2
============================================================================ */
const BRANCH_LABELS = { BR1: 'Branch 1', BR2: 'Branch 2' };
const urlParams = new URLSearchParams(window.location.search);
const BRANCH_ID = (function () {
  const p = (urlParams.get('branch') || '').toUpperCase();
  return BRANCH_LABELS[p] ? p : 'BR1';
})();
const BRANCH_LABEL = BRANCH_LABELS[BRANCH_ID];

/* ============================================================================
   STATE
============================================================================ */
let scannedItems = [];        // { barcodeCode, itemName, alternateUnit, countedQty }
let html5QrCode = null;
let lookupBusy = false;
let lastCode = '';
let lastCodeTime = 0;
const SCAN_COOLDOWN_MS = 600; // faster repeat-scan of the same item, still avoids duplicate frame triggers
let scanQueue = [];           // holds barcodes waiting to be looked up, in arrival order
let queueRunning = false;     // true while the queue worker is processing

/* ---------------------------------------------------------------------------
   MANUAL ENTRY MODE
   When ON, a successful barcode lookup (camera OR Bluetooth scanner) opens
   a small qty prompt instead of auto-adding the item with qty 1. The queue
   worker is "held" while the prompt is open, so any barcodes scanned while
   you're typing the qty just wait their turn instead of being lost or
   processed out of order.
--------------------------------------------------------------------------- */
let manualModeActive = false;
let pendingManualItem = null;  // the looked-up item currently shown in the modal
let holdQueue = false;         // true while the qty modal is open

/* ============================================================================
   INIT
============================================================================ */
document.addEventListener('DOMContentLoaded', function () {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    document.getElementById('configBanner').style.display = 'block';
  }
  document.getElementById('branchPill').innerHTML = '<i class="fa-solid fa-store"></i> ' + BRANCH_LABEL;
  document.getElementById('finalSubmitBtn').addEventListener('click', finalSubmit);
  wireManualEntryToggle();
  wireQtyModal();
  wireBluetoothScanner();
  startCamera();
});

/* ============================================================================
   MANUAL ENTRY TOGGLE
============================================================================ */
function wireManualEntryToggle() {
  const btn = document.getElementById('manualEntryBtn');
  btn.addEventListener('click', function () {
    manualModeActive = !manualModeActive;
    btn.classList.toggle('active', manualModeActive);
    btn.innerHTML = manualModeActive
      ? '<i class="fa-solid fa-pen"></i> Manual Entry: ON (scan to enter qty)'
      : '<i class="fa-solid fa-pen"></i> Manual Entry';
    setBanner(
      manualModeActive ? 'Manual Entry ON — scan a barcode to enter its qty...' : 'Point camera at a barcode...',
      ''
    );
  });
}

/* ============================================================================
   CAMERA — starts automatically, stays live, scans continuously
============================================================================ */
function startCamera() {
  html5QrCode = new Html5Qrcode('qrReader');

  const config = {
    fps: 20,
    qrbox: { width: 250, height: 140 },
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true // uses the browser's native, much faster decoder when available
    },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  };

  html5QrCode.start(
    { facingMode: 'environment' },
    config,
    processScan,
    function onFail() { /* silent — fires continuously while nothing is in frame */ }
  ).then(function () {
    setBanner('Point camera at a barcode...', '');
  }).catch(function (err) {
    setBanner('Camera error: ' + err, 'err');
  });
}

/**
 * Called by both the camera decoder and the Bluetooth scanner input.
 * Instead of firing an API call immediately (which could overlap with a
 * previous still-in-flight lookup and risk applying results out of order),
 * every scan is pushed onto a queue and processed one at a time, strictly
 * in the order they were scanned. This is what guarantees fast scanning
 * never drops a barcode or mixes up which result belongs to which item.
 */
function processScan(decodedText) {
  const now = Date.now();
  // Only dedupes REPEATS of the exact same code within the cooldown window
  // (the camera "sees" the same barcode across many frames); different
  // codes scanned back-to-back are never blocked by this.
  if (decodedText === lastCode && (now - lastCodeTime) < SCAN_COOLDOWN_MS) return;
  lastCode = decodedText;
  lastCodeTime = now;

  scanQueue.push(decodedText);
  setBanner('Queued: ' + decodedText + (scanQueue.length > 1 ? '  (' + scanQueue.length + ' waiting)' : ''), '');
  runQueue();
}

function runQueue() {
  if (queueRunning) return;      // already draining the queue
  if (scanQueue.length === 0) return;

  queueRunning = true;
  const code = scanQueue.shift();
  setBanner('Looking up ' + code + '...', '');

  apiGet({ action: 'getItemByBarcode', code: code, branch: BRANCH_ID })
    .then(function (result) {
      if (!result.found) {
        playSound('beepError');
        setBanner('❌ Not found: ' + code, 'err');
        return;
      }

      const item = result.item;
      const displayName = item.productName;

      if (manualModeActive) {
        // Manual Entry mode: don't auto-add — pop the qty prompt and let
        // the queue worker pause until the user saves or cancels it.
        playSound('beepSuccess');
        openQtyModal(item);
        return;
      }

      const existing = scannedItems.find(function (e) { return e.barcodeCode === item.userDefinedCode; });
      if (existing) {
        existing.countedQty += 1;
      } else {
        scannedItems.push({
          barcodeCode: item.userDefinedCode,
          itemName: displayName,
          alternateUnit: item.alternateUnit,
          countedQty: 1
        });
      }

      playSound('beepSuccess');
      setBanner('✅ ' + displayName + (item.alternateUnit ? ' (' + item.alternateUnit + ')' : ''), 'ok');
      renderList();
    })
    .catch(function (err) {
      playSound('beepError');
      setBanner('Lookup error — check connection.', 'err');
    })
    .finally(function () {
      if (holdQueue) return; // qty modal is open — resumed by closeQtyModal()
      queueRunning = false;
      if (scanQueue.length > 0) runQueue(); // immediately process the next queued scan
    });
}

/* ============================================================================
   MANUAL ENTRY QTY MODAL
============================================================================ */
function wireQtyModal() {
  document.getElementById('qtyModalSaveBtn').addEventListener('click', saveManualQtyEntry);
  document.getElementById('qtyModalCancelBtn').addEventListener('click', function () {
    setBanner('Manual entry cancelled.', '');
    closeQtyModal();
  });
  // Let Enter (from a Bluetooth-scanner-focused hidden input isn't relevant
  // here, but a physical keyboard's Enter while the qty box itself is
  // focused) submit the entry too.
  document.getElementById('qtyModalInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveManualQtyEntry();
    }
  });
}

function openQtyModal(item) {
  holdQueue = true;
  pendingManualItem = item;

  const existing = scannedItems.find(function (e) { return e.barcodeCode === item.userDefinedCode; });

  document.getElementById('qtyModalItemName').textContent =
    item.productName + (item.alternateUnit ? ' (' + item.alternateUnit + ')' : '');
  const qtyInput = document.getElementById('qtyModalInput');
  qtyInput.value = existing ? existing.countedQty : 1;

  document.getElementById('qtyModalOverlay').classList.add('show');
  blurBtInput(); // don't let the hidden BT-scanner input fight for focus
  setTimeout(function () {
    qtyInput.focus();
    qtyInput.select();
  }, 50);

  setBanner('Enter quantity for ' + item.productName + '...', '');
}

function saveManualQtyEntry() {
  if (!pendingManualItem) { closeQtyModal(); return; }

  const qtyInput = document.getElementById('qtyModalInput');
  const qty = Number(qtyInput.value);

  if (qtyInput.value === '' || isNaN(qty) || qty < 0) {
    qtyInput.focus();
    return; // keep the modal open until a valid qty is entered
  }

  const item = pendingManualItem;
  const existing = scannedItems.find(function (e) { return e.barcodeCode === item.userDefinedCode; });
  if (existing) {
    existing.countedQty = qty;
  } else {
    scannedItems.push({
      barcodeCode: item.userDefinedCode,
      itemName: item.productName,
      alternateUnit: item.alternateUnit,
      countedQty: qty
    });
  }

  playSound('beepSuccess');
  setBanner('✅ Saved ' + qty + ' x ' + item.productName, 'ok');
  renderList();
  closeQtyModal();
}

function closeQtyModal() {
  document.getElementById('qtyModalOverlay').classList.remove('show');
  pendingManualItem = null;
  holdQueue = false;

  // Resume the scan queue in case more barcodes were scanned while the
  // modal was open.
  queueRunning = false;
  if (scanQueue.length > 0) {
    runQueue();
  } else if (manualModeActive) {
    setBanner('Manual Entry ON — scan a barcode to enter its qty...', '');
  } else {
    setBanner('Point camera at a barcode...', '');
  }

  setTimeout(focusBtInput, 100);
}

/* ============================================================================
   BLUETOOTH BARCODE SCANNER SUPPORT
   Bluetooth scanners behave like a keyboard: they "type" the barcode into
   whatever input is focused, then send an Enter keypress automatically.
   This hidden input stays focused at all times so a Bluetooth scanner
   works alongside the camera without any extra setup.

   FIX: previously the page refocused this hidden input after EVERY click
   anywhere on the page — including taps on the qty +/- buttons, the
   remove button, and the Submit button. On mobile/touch devices, focusing
   a text input opens the on-screen keyboard, so those buttons appeared to
   "always open the keyboard". Now:
     1. The input has inputmode="none" so mobile browsers don't show a
        virtual keyboard for it at all (external/Bluetooth keyboards still
        work fine, since inputmode only affects the on-screen keyboard).
     2. The auto-refocus-on-click logic skips clicks that happen inside the
        scanned-items list or the bottom bar, so tapping qty/remove/submit
        never re-triggers focus games on that input.
============================================================================ */
function focusBtInput() {
  const el = document.getElementById('btScannerInput');
  if (el) el.focus({ preventScroll: true });
}

function blurBtInput() {
  const el = document.getElementById('btScannerInput');
  if (el) el.blur();
}

function wireBluetoothScanner() {
  const btInput = document.getElementById('btScannerInput');

  btInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = btInput.value.trim();
      btInput.value = '';
      if (val.length > 0) processScan(val);
    }
  });

  // Keep it focused so scans are captured the instant they happen — but
  // NOT when the user is interacting with on-page controls (qty buttons,
  // remove, submit), since focusing a text input pops the mobile keyboard.
  focusBtInput();

  document.addEventListener('click', function (e) {
    const isInteractiveArea = e.target.closest('.list-wrap') || e.target.closest('.bottom-bar') || e.target.closest('.qty-modal-overlay') || e.target.closest('.manual-entry-wrap');
    if (isInteractiveArea) {
      // Dismiss any keyboard that might already be open for this tap...
      blurBtInput();
      // ...then quietly refocus the hidden input a moment later, so the
      // Bluetooth scanner is ready again without the user having to tap
      // somewhere else first. The delay lets the keyboard-close animation
      // finish before we grab focus back (inputmode="none" also keeps the
      // keyboard from reopening at that point).
      setTimeout(focusBtInput, 300);
      return;
    }
    setTimeout(focusBtInput, 50);
  });

  window.addEventListener('focus', function () {
    // Don't yank focus back if the user is actively using a button/control.
    const active = document.activeElement;
    if (active && (active.closest('.list-wrap') || active.closest('.bottom-bar'))) return;
    focusBtInput();
  });
}

function setBanner(text, cls) {
  const el = document.getElementById('scanBanner');
  el.textContent = text;
  el.className = 'scan-banner' + (cls ? ' ' + cls : '');
}

/* ============================================================================
   SCANNED ITEMS LIST
============================================================================ */
function renderList() {
  const body = document.getElementById('scanTableBody');
  const badge = document.getElementById('countBadge');
  const submitBtn = document.getElementById('finalSubmitBtn');

  badge.textContent = scannedItems.length + ' item' + (scannedItems.length === 1 ? '' : 's');
  submitBtn.disabled = scannedItems.length === 0;

  if (scannedItems.length === 0) {
    body.innerHTML = '<tr><td colspan="4" class="empty-list">Point the camera at a barcode to start scanning...</td></tr>';
    return;
  }

  const reversed = scannedItems.slice().reverse();
  const originalIndexOf = function (entry) { return scannedItems.indexOf(entry); };

  body.innerHTML = reversed.map(function (entry) {
    const idx = originalIndexOf(entry);
    return (
      '<tr>' +
        '<td>' + escapeHtml(entry.itemName) + '</td>' +
        '<td class="text-muted">' + escapeHtml(entry.alternateUnit || '-') + '</td>' +
        '<td>' +
          '<span class="qty-adjust">' +
            '<button type="button" tabindex="-1" onclick="adjustQty(' + idx + ', -1)"><i class="fa-solid fa-minus"></i></button>' +
            '<span class="fw-semibold">' + escapeHtml(String(entry.countedQty)) + '</span>' +
            '<button type="button" tabindex="-1" onclick="adjustQty(' + idx + ', 1)"><i class="fa-solid fa-plus"></i></button>' +
          '</span>' +
        '</td>' +
        '<td><button class="remove-btn" tabindex="-1" onclick="removeItem(' + idx + ')" title="Remove"><i class="fa-solid fa-trash"></i></button></td>' +
      '</tr>'
    );
  }).join('');
}

function adjustQty(index, delta) {
  const entry = scannedItems[index];
  if (!entry) return;
  entry.countedQty = Math.max(0, entry.countedQty + delta);
  renderList();
}

function removeItem(index) {
  scannedItems.splice(index, 1);
  renderList();
}

/* ============================================================================
   FINAL SUBMIT
============================================================================ */
function finalSubmit() {
  if (scannedItems.length === 0) return;

  const btn = document.getElementById('finalSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

  const entries = scannedItems.map(function (e) {
    return {
      barcodeCode: e.barcodeCode,
      countedQty: e.countedQty,
      operatorName: '',
      remarks: ''
    };
  });

  apiPost({ action: 'recordStockCountBatch', data: { branchId: BRANCH_ID, entries: entries } })
    .then(function (result) {
      btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Submit';
      if (result.success) {
        playSound('beepSuccess');
        setBanner('✅ Saved ' + result.savedCount + ' items to ' + BRANCH_LABEL, 'ok');
        scannedItems = [];
        renderList();
      } else {
        playSound('beepError');
        setBanner(result.message || 'Submit failed.', 'err');
        btn.disabled = false;
      }
    })
    .catch(function (err) {
      btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Submit';
      playSound('beepError');
      setBanner('Error: ' + err.message, 'err');
      btn.disabled = false;
    });
}

/* ============================================================================
   API HELPERS
============================================================================ */
function apiGet(params) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    return Promise.reject(new Error('APPS_SCRIPT_URL is not set.'));
  }
  const query = new URLSearchParams(params).toString();
  return fetch(APPS_SCRIPT_URL + '?' + query, { method: 'GET' })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      try { return JSON.parse(text); }
      catch (e) { throw new Error('Invalid API response — check deployment access is "Anyone".'); }
    });
}

function apiPost(bodyObj) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    return Promise.reject(new Error('APPS_SCRIPT_URL is not set.'));
  }
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(bodyObj)
  })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      try { return JSON.parse(text); }
      catch (e) { throw new Error('Invalid API response — check deployment access is "Anyone".'); }
    });
}

/* ============================================================================
   UTILITIES
============================================================================ */
function playSound(id) {
  const audio = document.getElementById(id);
  if (audio) {
    audio.currentTime = 0;
    audio.play().catch(function () {});
  }
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
